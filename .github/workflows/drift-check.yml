name: Drift Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout browser-client
        uses: actions/checkout@v4
        with:
          path: scxml-http-browser-client

      - name: Checkout server (for OpenAPI spec)
        uses: actions/checkout@v4
        with:
          repository: PranayPant/scxml-http-server
          path: scxml-http-server

      - name: Checkout orchestrator (server dependency)
        uses: actions/checkout@v4
        with:
          repository: PranayPant/scxml-orchestrator
          path: scxml-orchestrator

      # --- Elixir setup for OpenAPI dump ---
      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Install server deps
        run: mix deps.get
        working-directory: scxml-http-server

      - name: Dump OpenAPI spec
        run: mix openapi.spec.json --spec ScxmlHttpEngine.OpenApi.ApiSpec --filename openapi.json --start-app=false
        working-directory: scxml-http-server

      # --- Node setup & typegen ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install client deps
        run: npm ci
        working-directory: scxml-http-browser-client

      - name: Generate TypeScript types from OpenAPI
        run: npx openapi-typescript ../scxml-http-server/openapi.json -o src/generated.ts
        working-directory: scxml-http-browser-client

      - name: Check for drift
        run: git diff --exit-code src/generated.ts
        working-directory: scxml-http-browser-client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
