name: CI

# Runs formatting, linting, type-checking, tests, and the 100% coverage gate
# on the PR flow (and on pushes to main) so that the same quality gates
# enforced locally by lefthook (pre-commit Biome format/lint and pre-push
# `biome check src tests` + `tsc --noEmit`) run in CI before a pull request
# merges. CI uses the package.json scripts directly rather than lefthook.
#
# Coverage thresholds (lines/functions/branches/statements at 100%) are
# defined in vitest.config.ts and enforced here via `npm run test:coverage`.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # `npm ci` runs the `postinstall` script (gen:types), which fetches
      # openapi.json from the server's GitHub release and regenerates
      # src/generated.ts, so it needs network access.
      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint check
        run: npm run lint:check

      - name: Type check
        run: npx tsc --noEmit

      # Reconcile the generated types against the OpenAPI contract the client
      # is built on. `gen:types` (run by postinstall) regenerates src/generated.ts
      # from the server's released openapi.json; this test fails on schema drift
      # (e.g. StateInfo.type enum) that would otherwise ship silently.
      - name: OpenAPI contract typecheck
        run: npm run test:typecheck-spec

      - name: Test
        run: npm test

      - name: Coverage (100% threshold from vitest.config.ts)
        run: npm run test:coverage
